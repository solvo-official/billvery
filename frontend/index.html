<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Billvery - AI Invoice Audit &amp; Management</title>
    <meta
      name="description"
      content="Billvery reads your invoices with AI, checks totals, tax and vendors against your ledger, and flags anything that needs a second look."
    />
    <meta name="application-name" content="Billvery" />
    <meta name="apple-mobile-web-app-title" content="Billvery" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Billvery" />
    <meta property="og:title" content="Billvery - AI Invoice Audit &amp; Management" />
    <meta
      property="og:description"
      content="Billvery reads your invoices with AI, checks totals, tax and vendors against your ledger, and flags anything that needs a second look."
    />
    <!-- 16-128 px in one file (public/favicon.ico). Bump ?v= when the icon changes so browsers refetch it. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem("invoice-auditor.theme");
          var dark = saved === "dark" || ((!saved || saved === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (error) {
          /* storage unavailable: follow the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
